name: Release

# 打包并发布安装包（构建作业 + 发布作业两段式，参照 add-truetype-rs / which-cli）。
#
# - push tag v*（如 `git tag v1.0.3 && git push origin v1.0.3`）
#     → 构建 4 个平台的安装包，汇总后创建 GitHub Release 并上传全部产物。
#       tag 版本必须与 src-tauri/tauri.conf.json 的 version 一致，否则构建作业直接失败，
#       避免出现"标签是 v1.0.3、安装包却叫 1.0.2"的错版发布。
# - workflow_dispatch（Actions 页手动运行）
#     → 只构建，产物以 artifact 形式保存供下载，不创建 Release。
#
# Build & publish installers (build job + release job, modeled on add-truetype-rs / which-cli):
# - push tag v*  → build the 4 platform bundles, then create a GitHub Release with all assets.
#   The tag version must match `version` in src-tauri/tauri.conf.json, otherwise the build job
#   fails early so we never publish a bundle labelled with the wrong version.
# - workflow_dispatch → build only; bundles are kept as downloadable artifacts.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 GitHub Release 需要写权限 / creating a GitHub Release requires write access.
permissions:
  contents: write

jobs:
  # ── 1. 构建：每个平台编译并打包，产物统一改名后上传为 artifact ──────────────
  # ── 1. build: compile & bundle per platform, rename, upload as an artifact ──
  build:
    name: build (${{ matrix.os_label }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：macos-latest 是 Apple Silicon runner，两个 target 都能出
          # macOS: macos-latest is an Apple Silicon runner and can build both targets
          - os: macos-latest
            os_label: macos
            arch: arm64
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            os_label: macos
            arch: amd64
            args: '--target x86_64-apple-darwin'
          # Linux：用 22.04 以获得更低的 glibc 基线
          # Linux: pin 22.04 for a lower glibc baseline
          - os: ubuntu-22.04
            os_label: linux
            arch: amd64
            args: ''
          - os: windows-latest
            os_label: windows
            arch: amd64
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Ubuntu 需要 webkit2gtk 等系统依赖；librsvg2-dev 与 patchelf 是 AppImage 打包
      # （linuxdeploy 的 gtk 插件）必需的，libfuse2 供 AppImage 运行时使用。
      # Linux needs webkit2gtk & friends; librsvg2-dev and patchelf are required by the
      # AppImage bundler (linuxdeploy's gtk plugin), libfuse2 by the AppImage runtime.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils libfuse2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # 两个 macOS target 只在 mac runner 上需要
          # both macOS targets are only needed on the macOS runner
          targets: ${{ matrix.os_label == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.os_label }}-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm ci

      # 版本号：tag 触发时以 tag 为准，并强制与 tauri.conf.json 一致；
      # 手动触发时用 tauri.conf.json 里的版本。
      # Version: for tag pushes the tag wins but must match tauri.conf.json;
      # manual runs use the version from tauri.conf.json.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGVER="${GITHUB_REF_NAME#v}"
            if [ "$TAGVER" != "$CONF" ]; then
              echo "::error::标签是 v${TAGVER}，但 src-tauri/tauri.conf.json 的 version 是 ${CONF}。请先把两者改成一致再打标签（同时建议同步 package.json 与 src-tauri/Cargo.toml）。"
              echo "::error::Tag v${TAGVER} does not match version ${CONF} in src-tauri/tauri.conf.json. Align them (and ideally package.json / src-tauri/Cargo.toml) before tagging."
              exit 1
            fi
            echo "version=${TAGVER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${CONF}" >> "$GITHUB_OUTPUT"
          fi
          echo "版本 / version: ${CONF}"

      # beforeBuildCommand 已经会跑 `npm run build`（vue-tsc + vite），
      # 这里只需要调 tauri build。
      # APPIMAGE_EXTRACT_AND_RUN=1 让 linuxdeploy 以自解压方式运行，不依赖 FUSE。
      # beforeBuildCommand already runs `npm run build` (vue-tsc + vite).
      # APPIMAGE_EXTRACT_AND_RUN=1 makes linuxdeploy self-extract instead of using FUSE.
      - name: Build bundles
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          npm run tauri build -- ${{ matrix.args }}

      # 把各打包器产出的文件收集到 release-assets/，改成统一命名：
      #   terminal_<版本>_<平台>_<架构>[.<扩展名>]
      # 与 dl 仓库里 which_/add-truetype_ 的命名风格保持一致。
      # 注意：不能用 dist/ —— 那是 Vite 的前端输出目录。
      # Collect every bundler output into release-assets/ with a uniform name:
      #   terminal_<version>_<os>_<arch>[.<ext>]
      # NOTE: do not use dist/ — that is Vite's frontend output directory.
      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          BASE="terminal_${VER}_${{ matrix.os_label }}_${{ matrix.arch }}"
          OUT=release-assets
          rm -rf "$OUT"
          mkdir -p "$OUT"
          found=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "${f##*.}" in
              dmg)      out="${BASE}.dmg" ;;
              msi)      out="${BASE}.msi" ;;
              exe)      out="${BASE}-setup.exe" ;;
              deb)      out="${BASE}.deb" ;;
              rpm)      out="${BASE}.rpm" ;;
              AppImage) out="${BASE}.AppImage" ;;
              *)        out="${BASE}.${f##*.}" ;;
            esac
            cp -f "$f" "$OUT/$out"
            echo "  $f"
            echo "    -> $OUT/$out"
            found=$((found + 1))
          done < <(find src-tauri/target -type f \
                     \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' \
                        -o -name '*.rpm' -o -name '*.AppImage' -o -name '*setup.exe' \) )
          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到任何安装包，打包可能失败了 / no bundles were produced"
            exit 1
          fi
          echo
          echo "产物 / artifacts:"
          ls -lh "$OUT"/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal-${{ steps.version.outputs.version }}-${{ matrix.os_label }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  # ── 2. 发布：等所有平台构建完成，汇总产物并创建 Release ──────────────────
  # ── 2. release: wait for every platform, collect assets, create the Release ──
  release:
    name: publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # 如果希望先出草稿、人工确认后再发布，把 draft 改成 true。
          # Set draft to true if you prefer a draft release reviewed by a human first.
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
