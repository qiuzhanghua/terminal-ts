name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Unit tests
        run: npm test

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Rust crate lives in src-tauri/, and there is no Cargo.toml at the repo
    # root — without this every cargo command below dies with
    # "could not find `Cargo.toml`" instead of actually checking the code.
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      # Compiling tauri on Linux needs webkit2gtk & friends via pkg-config; the
      # runner does not ship them. Windows needs no such step, which is why the
      # job is green there and red on ubuntu. Mirrors release.yml — the bundler-
      # only bits (librsvg2-dev, patchelf, libfuse2) are left out because CI
      # never builds an AppImage.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache only auto-detects a workspace at the repo root; point it
          # at the crate so the cache key and target dir are correct.
          workspaces: "src-tauri -> target"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
